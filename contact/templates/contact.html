{% extends 'core/core.html' %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'core/css/contact.css' %}">
{% endblock css %}

{% block header %}
<div class="contact-section">
    <div class="container">
        <!-- Centered Contact Title -->
        <div class="row justify-content-center">
            <div class="col-md-12 text-center">
                <h2 class="section-title">Contact Me</h2>
            </div>
        </div>
        
        <div class="row mt-6">
            <!-- Contact Form -->
            <div class="col-md-6">
                <h5 class="contact-heading">Get in Touch</h5>
                <form action="{% url 'contact' %}" method="POST" class="contact-form">
                    {% csrf_token %}
                    <div class="form-group">
                        <P><input type="text" name="name" class="form-control" placeholder="Your Name" required></P>
                    </div>
                    <div> </div>
                    <div class="form-group">
                        <P>
                        <input type="email" name="email" class="form-control" placeholder="Your Email" required>
                    </P>
                    </div>
                    <div class="form-group">
                        <p>
                        <textarea name="message" class="form-control" rows="5" placeholder="Your Message" required></textarea>
                    </P>
                    </div>
                    <button type="submit" class="btn btn-custom">Send Message</button>
                </form>
            </div>

            <!-- Contact Information -->
            <div class="col-md-6">
                <h5 class="contact-heading">Contact Information</h5>
                <div class="contact-info text-center">
                    <p><i class="fas fa-phone-alt"></i> +91 6202741771</p>
                    <p><i class="fas fa-envelope"></i> ayaanalam0852@gmail.com</p>
                    <p><i class="fas fa-map-marker-alt"></i> New Delhi, India</p>
                    <div class="social-icons">
                        <a href="https://github.com/mohammadayaan07" target="_blank" class="icon"><i class="fab fa-github"></i></a>
                        <a href="https://www.linkedin.com/in/mohammad-ayaan-alam/" target="_blank" class="icon"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock header %}
