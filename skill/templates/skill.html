{% extends 'core/core.html' %}
{% load static %}
{% block css %}
<link rel="stylesheet" href="{% static 'core/css/skill.css' %}">
{% endblock css %}

{% block header %}
<div class="skills-section text-center">
    <h2 class="section-title">Skills</h2>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="skill-card">
                    <h5 class="skill-title">Python</h5>
                    <div class="skill-level">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 90%;" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100">90%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="skill-card">
                    <h5 class="skill-title">Django</h5>
                    <div class="skill-level">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 85%;" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100">85%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="skill-card">
                    <h5 class="skill-title">Data Analysis</h5>
                    <div class="skill-level">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 80%;" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">80%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="skill-card">
                    <h5 class="skill-title">AWS</h5>
                    <div class="skill-level">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="skill-card">
                    <h5 class="skill-title">MySQL</h5>
                    <div class="skill-level">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 70%;" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">70%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="skill-card">
                    <h5 class="skill-title">HTML/CSS</h5>
                    <div class="skill-level">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 65%;" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">65%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="skill-card">
                    <h5 class="skill-title">Power BI</h5>
                    <div class="skill-level">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">75%</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="skill-card">
                    <h5 class="skill-title">REST API</h5>
                    <div class="skill-level">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 65%;" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">65%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock header %}
