<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'core/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/bootstrap.css' %}">
<link rel="stylesheet" href="{% static 'core/css/core.css' %}"> 
{% block css %} {% endblock css %}
</head>
<body>
    <div class="container-fluid bg-dark">
        <div class="row">
            <div class="col-sm-2">
                <div class="border-right border-warning h-100" style="height: 100vh;">
                    <div class="text-center">
                        <img src="{% static 'core/image/ayaan.jpg' %}" alt="Profile-pic" class="image-fluid rounded-circle mt-3" width="100px" height="100px">
                    </div>
                    <h5 class="text-white mt-3"> Mohammad Ayaan Alam</h5>
                    <hr class="border-light">
                    <nav class="nav flex-column text-center">
                        <a href="{% url 'home' %}" class="nav-link"> Home</a>
                        <a href="{% url 'skill' %}" class="nav-link"> Skills</a>
                        <a href="{% url 'education' %}" class="nav-link">Education</a>
                        <a href="{% url 'project' %}" class="nav-link"> Projects</a>
                        <a href="{% url 'contact' %}" class="nav-link"> Contact</a>
                    </nav>
                </div>
                <div class="social-links mt-2 ">
                    <a href="https://www.linkedin.com/in/mohammad-ayaan-alam" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="https://github.com/mohammadayaan07" target="_blank"><i class="fab fa-github"></i></a>
                    <a href="{% url 'contact' %}" target="_blank">
                        <i class="fas fa-envelope "></i>
                    </a>
                </div>
               
                
            </div>
            <div class="col-sm-10 border-left border-warning" style="height: 100vh;"> <!-- Added border-left here -->
                {% block header %} {% endblock header %}
            </div>
        </div>
    </div>
    
    <script src="{% static 'core/js/jquery.js' %}"></script>
    <script src="{% static 'core/js/popper.js' %}"></script>
    <script src="{% static 'core/js/all.min.js' %}"></script>
    <script src="{% static 'core/js/bootstrap.js' %}"></script>
   

</body>
</html>
